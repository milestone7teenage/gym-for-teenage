name: ROS iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -e

          APP_PATH="build/ios/iphoneos/Runner.app"
          IPA_DIR="build/ios/ipa"
          STAGING_DIR="$IPA_DIR/staging"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app was not created at $APP_PATH"
            exit 1
          fi

          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR/Payload"
          mkdir -p "$IPA_DIR"

          cp -R "$APP_PATH" "$STAGING_DIR/Payload/Runner.app"

          cd "$STAGING_DIR"
          zip -qry "../Gym-for-Teenage.ipa" Payload

          echo "Created:"
          ls -lh "../Gym-for-Teenage.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gym-for-Teenage-unsigned-IPA
          path: build/ios/ipa/Gym-for-Teenage.ipa
          if-no-files-found: error
